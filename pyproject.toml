[project]
name = "cloud-anomaly-detection"
version = "0.1.0"
description = "Production-grade system-log anomaly detection for HDFS workloads."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "google-genai>=1.13.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "networkx>=3.4.2",
    "numpy>=2.3.0",
    "pandas>=3.0.2",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.8.0",
    "torch==2.11.0+cu128",
    "tqdm>=4.66.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
prepare_hdfs = "src.experts.system_expert.parser:main"
prepare_cicids = "src.experts.network_expert.parser:main"
preprocess_cicids_binary = "src.experts.network_expert.parser:main"
train_hdfs = "src.experts.system_expert.train:main"
train_cicids = "src.experts.network_expert.train:main"
train_cicids_binary = "src.experts.network_expert.train:main"
test_hdfs = "src.experts.system_expert.test:main"
serve_system_api = "src.api.system_api:main"
serve_network_api = "src.api.network_api:main"
serve_cross_layer_api = "src.api.cross_layer_api:main"
test_cicids = "src.experts.network_expert.test:main"
test_cicids_binary = "src.experts.network_expert.test:main"
train_correlation = "src.correlation.train:main"
run_correlation = "src.correlation.pipeline:main"
run_model_tests = "src.validation.model_checks:main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
